{% extends "base.html" %}

{% block title %}Nouveau Sujet PFE{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow">
    <h2 class="text-xl font-bold text-gray-900 mb-6">Déposer un Sujet de PFE</h2>
    
    <form action="/api/v1/projects" method="POST" class="space-y-6">
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700">Titre du projet *</label>
            <input type="text" name="title" id="title" required minlength="5" placeholder="Ex: Plateforme de Télémédecine avec IA"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
        </div>

        <div>
            <label for="company" class="block text-sm font-medium text-gray-700">Entreprise d'accueil (ou laboratoire)</label>
            <input type="text" name="company" id="company" placeholder="Ex: Capgemini / ENSA Fès"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-gray-700">Description détaillée du sujet *</label>
            <textarea name="description" id="description" rows="5" required minlength="20" placeholder="Décrivez le contexte, les objectifs et les technologies envisagées..."
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"></textarea>
        </div>

        <div class="flex justify-end space-x-3">
            <a href="/web/projects" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">Annuler</a>
            <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                Enregistrer le sujet
            </button>
        </div>
    </form>
</div>
{% endblock %}
