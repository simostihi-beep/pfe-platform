<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion PFE{% endblock %} - ENSA Fès</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="h-full flex flex-col text-gray-900">
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-4">
                    <span class="font-bold text-xl tracking-wide">🎓 PFE Platform</span>
                    <a href="/web/projects" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-indigo-700">Projets</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/docs" target="_blank" class="text-sm bg-indigo-500 hover:bg-indigo-400 px-3 py-1.5 rounded-md font-medium">API Docs</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-sm text-gray-500">
        DevOps & Conteneurisation – ENSA Fès, Génie Informatique &copy; 2026
    </footer>
</body>
</html>
