[alembic]
# Chemin vers le dossier des scripts de migration
script_location = migrations

# Format du nom des fichiers de migration
file_template = %%(rev)s_%%(slug)s

# Fuseau horaire
timezone = UTC

# Tronquer la longueur du slug
truncate_slug_length = 40

# Détection de l'encodage
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
